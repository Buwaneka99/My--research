# ============================================================
# DeepSentinel — VAE-With-DSAA Model Configuration
# R26-IT-121 | IT22109194 | Wijesinghe L P D B
# ============================================================

dataset:
  source: kaggle/ealaxi/paysim1
  transaction_types: [TRANSFER, CASH_OUT, PAYMENT]
  features: 13
  feature_names:
    - F1_log_amount
    - F2_amount_balance_ratio
    - F3_balance_consistency
    - F4_balance_change_ratio
    - F5_dest_balance_ratio
    - F6_hour
    - F7_day
    - F8_is_large
    - F9_dest_starts_empty
    - F10_recipient_emptied
    - F11_account_velocity
    - F12_round_amount
    - F13_zero_dest_history

vae:
  input_dim: 13
  activation: relu
  output_activation: sigmoid
  # Per-type architectures (CASH_OUT needs more capacity)
  per_type:
    TRANSFER:
      hidden_1: 32
      hidden_2: 16
      latent_dim: 8
    CASH_OUT:
      hidden_1: 64
      hidden_2: 32
      latent_dim: 16
    PAYMENT:
      hidden_1: 32
      hidden_2: 16
      latent_dim: 8

training:
  epochs: 50
  batch_size: 256
  learning_rate: 0.001
  beta_anneal_epochs: 10
  free_bits_lambda: 0.01
  train_val_split: 0.8
  early_stopping_patience: 5

anomaly_scoring:
  alpha: 0.5            # reconstruction error weight
  beta:  0.3            # KL divergence weight
  gamma: 0.2            # latent density weight (new)
  threshold_metric: f2  # F2-score weights recall 2x precision
  threshold_tune_split: 0.3

google_drive:
  base: /content/drive/MyDrive/DeepSentinel
  output: /content/drive/MyDrive/DeepSentinel/DeepSentinel_Output
  eda: /content/drive/MyDrive/DeepSentinel/DeepSentinel_EDA
  results: /content/drive/MyDrive/DeepSentinel/DeepSentinel_Results_v2
